name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Play … on Spotify\n2. Open settings → …"
  - type: input
    id: compositor
    attributes:
      label: Compositor / desktop
      placeholder: niri 26.04, Hyprland 0.50, KDE Plasma 6.4 …
    validations:
      required: true
  - type: input
    id: quickshell
    attributes:
      label: Quickshell version
      description: Output of `qs --version`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `journalctl --user -u islet -n 50` and `islet status`
      render: shell
